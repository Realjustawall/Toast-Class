name: TOASTER checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: toaster
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: toaster_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U toaster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://toaster:ephemeral-ci-only@localhost:5432/toaster_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: docs/screenshots/
