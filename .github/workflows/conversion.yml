name: TOASTER isolated document conversion
on: [push, pull_request]
permissions:
  contents: read
jobs:
  conversion:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: toaster
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: toaster_test
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U toaster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://toaster:ephemeral-ci-only@localhost:5432/toaster_test
      TEST_CONVERSION_DOCKER: 'true'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: docker build -f infrastructure/docker/Dockerfile.converter -t toaster-converter .
      - run: sudo python3 scripts/test_converter.py
      - run: npm run typecheck
      - run: sudo -E env "PATH=$PATH" npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: conversion-browser-evidence
          path: |
            test-results/
            docs/screenshots/
          retention-days: 7
