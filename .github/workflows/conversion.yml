name: TOASTER isolated document conversion
on: [push, pull_request]
permissions:
  contents: read
jobs:
  conversion:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: toaster
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: toaster_test
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U toaster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://toaster:ephemeral-ci-only@localhost:5432/toaster_test
      TEST_CONVERSION_DOCKER: 'true'
      TEST_PLATFORM_ADMIN_SEED: 'true'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: docker build -f infrastructure/docker/Dockerfile.converter -t toaster-converter .
      - run: sudo python3 scripts/test_converter.py
      - run: npm run typecheck
      - run: sudo -E env "PATH=$PATH" npm test
      - run: npx playwright install --with-deps chromium
      - run: npx tsx scripts/prepare-media-ci.ts
      - run: >-
          docker run -d --name toaster-test-media --network host
          --mount type=bind,source=${{ github.workspace }}/.local/livekit-ci.yaml,target=/etc/livekit.yaml,readonly
          livekit/livekit-server:v1.13.11 --config /etc/livekit.yaml
      - name: Wait for signaling liveness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:7880/ > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: sudo -E env "PATH=$PATH" PLAYWRIGHT_BROWSERS_PATH=/home/runner/.cache/ms-playwright npm run test:e2e
      - if: always()
        run: docker stop toaster-test-media || true
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: conversion-browser-evidence
          path: |
            test-results/
            docs/screenshots/
          retention-days: 7
