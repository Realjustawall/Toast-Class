name: Real SFU integration
on:
  workflow_dispatch:
  pull_request:
    paths:
      [
        'apps/api/**',
        'apps/web/**',
        'packages/database/**',
        'tests/media/**',
        'playwright.media.config.ts',
        'package-lock.json',
      ]
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: toaster
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: toaster_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U toaster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://toaster:ephemeral-ci-only@localhost:5432/toaster_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsx scripts/prepare-media-ci.ts
      - run: >-
          docker run -d --name toaster-test-media --network host
          --mount type=bind,source=${{ github.workspace }}/.local/livekit-ci.yaml,target=/etc/livekit.yaml,readonly
          livekit/livekit-server:v1.13.11 --config /etc/livekit.yaml
      - name: Wait for signaling liveness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:7880/ > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm run test:media
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-browser-evidence
          path: |
            docs/screenshots/
            test-results/
      - if: always()
        run: docker stop toaster-test-media
