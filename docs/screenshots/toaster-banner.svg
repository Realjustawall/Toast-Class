<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="TOASTER Classroom Banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="82%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)" />
  <rect width="1200" height="320" rx="20" fill="url(#glow1)" />
  <rect width="1200" height="320" rx="20" fill="url(#glow2)" />
  <rect x="1.5" y="1.5" width="1197" height="317" rx="19" fill="none" stroke="url(#accent)" stroke-opacity="0.35" stroke-width="2" />

  <!-- Subtle grid -->
  <g stroke="#94a3b8" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="240" y1="0" x2="240" y2="320" />
    <line x1="480" y1="0" x2="480" y2="320" />
    <line x1="720" y1="0" x2="720" y2="320" />
    <line x1="960" y1="0" x2="960" y2="320" />
  </g>

  <!-- Title -->
  <text x="600" y="128" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" font-size="60" font-weight="800" letter-spacing="2" fill="#f8fafc">
    TOASTER Classroom
  </text>
  <rect x="440" y="148" width="320" height="4" rx="2" fill="url(#accent)" />

  <!-- Subtitle -->
  <text x="600" y="194" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#cbd5e1">
    Self-Hosted Bilingual Online Classroom • LiveKit • Boards &amp; PDF • Sandboxed HTML/JS • GeoGebra
  </text>

  <!-- Feature Pills -->
  <g font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">
    <rect x="205" y="228" width="140" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.55" />
    <text x="275" y="250" fill="#e0f2fe">LiveKit WebRTC</text>

    <rect x="363" y="228" width="150" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.55" />
    <text x="438" y="250" fill="#e0e7ff">Sandboxed Boards</text>

    <rect x="531" y="228" width="138" height="34" rx="17" fill="#1e293b" stroke="#34d399" stroke-opacity="0.55" />
    <text x="600" y="250" fill="#d1fae5">MySQL 8.4 / PG</text>

    <rect x="687" y="228" width="145" height="34" rx="17" fill="#1e293b" stroke="#f472b6" stroke-opacity="0.55" />
    <text x="759.5" y="250" fill="#fce7f3">EN (LTR) / FA (RTL)</text>

    <rect x="850" y="228" width="145" height="34" rx="17" fill="#1e293b" stroke="#fbbf24" stroke-opacity="0.55" />
    <text x="922.5" y="250" fill="#fef3c7">1-Command Install</text>
  </g>
</svg>
